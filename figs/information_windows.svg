<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title description">
<title id="title">Use layers, tokens, or both</title>
<desc id="description">One grid of supplied residual states over the example prompt positions You, are, absolutely. Gray arrows show upward residual flow. Blue arrows show possible attention connections from earlier positions into the next layer, including a connection that skips a position. A user-defined function takes the supplied activations and returns a residual-stream component, drawn as a shaded dashed box. Words are read from that component; sure, certain, confident are illustrative examples, not measured outputs.</desc>
<!-- Drafted by PI/OpenAI; simplified from the computation-grid idea in wassname/vjp-steering/docs/img/jacobian_vjp_causal_graph.svg. -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68727c"/></marker>
<marker id="residual" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a0a7ae"/></marker>
<marker id="attention" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#418daf"/></marker>
</defs>
<style>
text {font-family:'DejaVu Sans',sans-serif;fill:#26313b;font-size:17px}
.heading {font-size:25px;font-weight:600}
.small {font-size:15px;fill:#58636c}
.code {font-family:'DejaVu Sans Mono',monospace;font-size:19px}
</style>
<rect width="900" height="530" fill="#fff"/>
