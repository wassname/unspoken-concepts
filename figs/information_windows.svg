1a0" stroke="#8751a0" stroke-width="1.5"/><circle cx="135" cy="285" r="7" fill="#fff" stroke="#a0a7ae" stroke-width="1.5"/><circle cx="275" cy="285" r="7" fill="#8751a0" stroke="#8751a0" stroke-width="1.5"/><circle cx="415" cy="285" r="7" fill="#8751a0" stroke="#8751a0" stroke-width="1.5"/><circle cx="135" cy="350" r="7" fill="#fff" stroke="#a0a7ae" stroke-width="1.5"/><circle cx="275" cy="350" r="7" fill="#8751a0" stroke="#8751a0" stroke-width="1.5"/><circle cx="415" cy="350" r="7" fill="#8751a0" stroke="#8751a0" stroke-width="1.5"/><path d="M85,370 L85,133" fill="none" stroke="#68727c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="62" y="253" class="" text-anchor="middle" transform="rotate(-90 62 253)">Combine layers</text><text x="135" y="400" class="code" text-anchor="middle">You</text><text x="275" y="400" class="code" text-anchor="middle">are</text><text x="415" y="400" class="code" text-anchor="middle">absolutely</text><path d="M117,425 L438,425" fill="none" stroke="#68727c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="278" y="455" class="" text-anchor="middle">Combine token positions</text><path d="M455,169 L515,169" fill="none" stroke="#68727c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="675" y="176" class="code" text-anchor="middle">your_function(hs)</text><path d="M675,199 L675,231" fill="none" stroke="#68727c" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="535" y="245" width="280" height="62" rx="10" fill="#8751a0" fill-opacity="0.08" stroke="#8751a0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="675" y="282" class="" text-anchor="middle">Residual-stream component</text><path d="M675,322 L675,354" fill="none" stroke="#68727c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="675" y="382" class="small" text-anchor="middle">Illustrative words</text><text x="675" y="413" class="" text-anchor="middle">⟨sure, certain, confident⟩</text><path d="M535,447 L565,447" fill="none" stroke="#a0a7ae" stroke-width="1.3" marker-end="url(#residual)"/><text x="578" y="452" class="small" text-anchor="start">Residual flow</text><path d="M535,476 L565,476" fill="none" stroke="#418daf" stroke-width="1.5" marker-end="url(#attention)"/><text x="578" y="481" class="small" text-anchor="start">Possible attention routes</text><text x="35" y="516" class="small" text-anchor="start">Input embeddings and unlabelled calibration data are also supplied.</text></svg>